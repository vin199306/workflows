name: SimAdmin Build armv7 (MSM8916 骁龙410 Android4.4)
on:
  workflow_dispatch:
    inputs:
      ver_manual:
        description: 手动版本号(留空自动读取Cargo.toml)
        required: false
        default: ""

env:
  SRC_REPO: 3899/SimAdmin
  TARGET: armv7-unknown-linux-musleabihf
  TOOLCHAIN_FILE: armv7l-linux-musleabihf-cross.tgz
  TOOLCHAIN_URL: https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/${{ env.TOOLCHAIN_FILE }}
  BIN_NAME: simadmin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 拉取SimAdmin源码
      - name: Checkout SimAdmin source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          fetch-depth: 1

      # 系统基础依赖
      - name: Install base packages
        run: |
          sudo apt update
          sudo apt install -y git curl pkg-config
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
          sudo apt install -y nodejs

      # 下载 musl 交叉工具链 (从github release，不再访问musl.cc)
      - name: Download armv7 musl cross toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -fsSL -o ${{ env.TOOLCHAIN_FILE }} ${{ env.TOOLCHAIN_URL }}
          tar -zxf ${{ env.TOOLCHAIN_FILE }}
          echo "$PWD/armv7l-linux-musleabihf-cross/bin" >> $GITHUB_PATH

      # 解析版本号
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.ver_manual }}" ]; then
            VER="${{ github.event.inputs.ver_manual }}"
          else
            VER=$(grep '^version = ' backend/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "VER=$VER" >> $GITHUB_ENV
          echo "version=$VER" >> $GITHUB_OUTPUT

      # 编译前端
      - name: Build frontend static assets
        run: |
          cd frontend
          npm ci
          npm run build

      # 安装Rust
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ env.TARGET }}
          override: true

      # 后端交叉编译
      - name: Build backend static binary
        run: |
          cd backend
          cargo build --release --target ${{ env.TARGET }}
        env:
          CC_armv7_unknown_linux_musleabihf: armv7l-linux-musleabihf-gcc
          CXX_armv7_unknown_linux_musleabihf: armv7l-linux-musleabihf-g++
          RUSTFLAGS: "-C target-cpu=cortex-a53"

      # 打包产物
      - name: Package archive
        run: |
          mkdir -p artifact/simadmin
          cp backend/target/${{ env.TARGET }}/release/${{ env.BIN_NAME }} artifact/simadmin/
          cp -r frontend/dist artifact/simadmin/www
          cd artifact
          tar -zcvf simadmin-armv7-${{ env.VER }}.tar.gz simadmin

      # 发布Release
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-armv7
          name: SimAdmin ${{ env.VER }} armv7 (MSM8916 Android4.4)
          body: |
            ### 编译信息
            - 目标架构：armv7-unknown-linux-musleabihf
            - CPU优化：Cortex-A53 (骁龙410 MSM8916)
            - 运行环境：Android4.4 32位Linux容器
            - 静态musl链接，无外部libc依赖
          files: artifact/simadmin-armv7-${{ env.VER }}.tar.gz
          draft: false
          prerelease: false
