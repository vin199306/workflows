name: Build-OTA-Package-ARMv7

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 Cargo.toml 自动读取）'
        required: false
        type: string
        default: ''
      use_upx:
        description: 'UPX 压缩二进制（armv7 建议关闭以避免兼容性问题）'
        required: false
        type: boolean
        default: false
      release_type:
        description: '发布类型'
        required: true
        type: choice
        default: '预发布版（pre-release）'
        options:
          - '最新正式版（latest release）'
          - '预发布版（pre-release）'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SIMADMIN_REPO: 3899/SimAdmin
  TARGET: armv7-unknown-linux-musleabihf
  ZIG_VERSION: '0.13.0'

permissions:
  contents: write

jobs:
  build:
    name: Build armv7 (MSM8916 / Android 4.4)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout SimAdmin source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SIMADMIN_REPO }}
          fetch-depth: 0

      # ---------- 版本号 ----------
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            if [ -f VERSION ]; then
              VERSION=$(tr -d '[:space:]' < VERSION)
            elif [ -f backend/Cargo.toml ]; then
              VERSION=$(grep -m1 '^version' backend/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
            else
              VERSION="0.1.0"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: Sync version numbers
        run: |
          printf '%s\n' "$VERSION" > VERSION
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" backend/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" frontend/package.json

      # ---------- Rust ----------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-armv7-musleabihf-cargo-${{ hashFiles('backend/Cargo.lock') }}

      # ---------- zig（内置 musl 交叉编译，替代 musl.cc 工具链） ----------
      - name: Install zig (musl cross-compiler)
        run: |
          curl -fsSL "https://github.com/ziglang/zig/releases/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            -o /tmp/zig.tar.xz
          sudo tar -xf /tmp/zig.tar.xz -C /opt/
          rm -f /tmp/zig.tar.xz
          echo "/opt/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
          # 创建包装脚本，供 Rust / cc-rs 调用
          sudo tee /usr/local/bin/armv7-musleabihf-cc > /dev/null << 'EOF'
#!/bin/bash
exec zig cc -target arm-linux-musleabihf "$@"
EOF
          sudo chmod +x /usr/local/bin/armv7-musleabihf-cc
          zig version
          armv7-musleabihf-cc --version

      - name: Install UPX
        if: inputs.use_upx == true
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      # ---------- 前端 ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm exec vite build

      # ---------- 后端 ----------
      - name: Build backend
        working-directory: backend
        env:
          SQLITE3_STATIC: '1'
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '0'
          CC_armv7_unknown_linux_musleabihf: armv7-musleabihf-cc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: armv7-musleabihf-cc
          # 高通410 (MSM8916) Cortex-A53：启用 VFPv4 + NEON
          RUSTFLAGS: '-C target-cpu=cortex-a53'
        run: |
          cargo build --locked --release --target "$TARGET"
          file "target/$TARGET/release/simadmin"

      - name: Compress backend with UPX
        if: inputs.use_upx == true
        run: upx --best --lzma "backend/target/$TARGET/release/simadmin"

      # ---------- 打包 OTA ----------
      - name: Package OTA
        run: |
          # pack-ota.sh 原生仅支持 aarch64 / x86_64，注入 armv7 支持
          python3 << 'PYEOF'
          with open('scripts/pack-ota.sh', 'r') as f:
              s = f.read()
          s = s.replace(
              '--target=x86_64|--target=amd64|--target=x86_64-unknown-linux-musl)',
              '--target=x86_64|--target=amd64|--target=x86_64-unknown-linux-musl)\n            --target=armv7|--target=armv7l|--target=armv7-unknown-linux-musleabihf)\n                TARGET="armv7-unknown-linux-musleabihf"\n                ;;'
          )
          s = s.replace(
              'x86_64|amd64) TARGET="x86_64-unknown-linux-musl" ;;',
              'x86_64|amd64) TARGET="x86_64-unknown-linux-musl" ;;\n    armv7|armv7l) TARGET="armv7-unknown-linux-musleabihf" ;;\n    armv7-unknown-linux-musleabihf) ;;'
          )
          with open('scripts/pack-ota.sh', 'w') as f:
              f.write(s)
          PYEOF

          ./scripts/pack-ota.sh --target="$TARGET"
          SOURCE="release/simadmin_${VERSION}_${TARGET}.tar.gz"
          DEST="release/simadmin-armv7.tar.gz"
          mv "$SOURCE" "$DEST"
          sha256sum release/*.tar.gz

      - name: Upload OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-armv7
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download OTA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ota-*
          path: release
          merge-multiple: true

      - name: Generate checksums and release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd release
          sha256sum -- ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cd ..
          BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y/%m/%d %H:%M:%S')
          ARMV7_HASH=$(grep 'simadmin-armv7.tar.gz' release/SHA256SUMS | cut -d' ' -f1)
          cat > release/RELEASE_BODY.md << EOF
            ## OTA 更新包 — 安卓4.4 / 高通410 (MSM8916) 专用
            
            ### 版本信息
            
            | 项目 | 值 |
            | :--- | :--- |
            | **版本** | ${VERSION} |
            | **Commit** | \`${COMMIT_SHA}\` |
            | **构建时间** | ${BUILD_TIME} |
            | **发布类型** | ${RELEASE_TYPE} |
            | **目标 CPU** | 高通骁龙410 / MSM8916 / Cortex-A53 |
            | **目标系统** | 安卓4.4 (KitKat) + Linux 容器 |
            | **Rust Target** | \`armv7-unknown-linux-musleabihf\` |
            | **链接方式** | musl 静态链接（zig cc） |
            | **CPU 优化** | \`target-cpu=cortex-a53\`（VFPv4 + NEON） |
            
            ### 资产包
            
            | 架构 / 平台 | 文件名 | SHA-256 |
            | :--- | :--- | :--- |
            | **armv7l / MSM8916** | \`simadmin-armv7.tar.gz\` | \`${ARMV7_HASH}\` |
            
            ### 包内容
            
            \`\`\`
            simadmin-armv7.tar.gz
            ├── simadmin          # 后端二进制 (armv7 静态链接)
            ├── www/              # 前端 SPA 静态文件
            └── meta.json         # 版本元数据
            \`\`\`
            
            ### 部署说明
            
            在安卓4.4 设备的 Linux 容器（Linux Deploy / chroot / Termux 等）内以 root 执行：
            
            \`\`\`bash
            tar -xzf simadmin-armv7.tar.gz -C /opt/simadmin/
            /opt/simadmin/simadmin --host :: --port 3000
            \`\`\`
            
            > SimAdmin 依赖 ModemManager / systemd / D-Bus，纯安卓环境无法直接运行，需完整 Linux 容器。
            > 高通410 虽为 64 位 CPU，但安卓4.4 仅运行在 32 位模式，故采用 armv7 目标。
            
            **源码**: https://github.com/${SIMADMIN_REPO}
            EOF

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-armv7
          name: SimAdmin_v${{ needs.build.outputs.version }}_armv7-MSM8916
          files: |
            release/simadmin-armv7.tar.gz
            release/SHA256SUMS
          body_path: release/RELEASE_BODY.md
          overwrite_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ inputs.release_type == '预发布版（pre-release）' }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${VERSION}-armv7"
          {
            echo "## Build Complete"
            echo ""
            echo "- **Target**: armv7-unknown-linux-musleabihf (MSM8916 / Android 4.4)"
            echo "- **Version**: $VERSION"
            echo "- **Release**: $RELEASE_URL"
            echo ""
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
